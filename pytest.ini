[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Pure unit tests, no threading
    integration: Integration tests using ProgramExecutor with mocks
    scenario: End-to-end program execution scenarios on simulated hardware
    simulation: Accelerated thermal simulation tests (slow)
    fault: Fault injection tests
    slow: Tests that take >30s wall-clock
